name: Build Calculator APK

"on":
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android build tools
    run: |
      sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Prepare APK project
    run: |
      mkdir -p app/src/main/assets app/src/main/java/com/zafar/calculator
      cp index.html app/src/main/assets/index.html
      cat > settings.gradle <<'EOF'
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }
      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
              google()
              mavenCentral()
          }
      }
      rootProject.name = "ZafarCalculator"
      include(":app")
      EOF
      cat > build.gradle <<'EOF'
      plugins {
          id 'com.android.application' version '8.6.1' apply false
      }
      EOF
      cat > app/build.gradle <<'EOF'
      plugins {
          id 'com.android.application'
      }
      android {
          namespace 'com.zafar.calculator'
          compileSdk 35
          defaultConfig {
              applicationId 'com.zafar.calculator'
              minSdk 23
              targetSdk 28
              versionCode 1
              versionName '1.0'
          }
      }
      EOF
      cat > app/src/main/AndroidManifest.xml <<'EOF'
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="Zafar's Calculator">
              <activity android:name=".MainActivity" android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
              </activity>
          </application>
      </manifest>
      EOF
      cat > app/src/main/java/com/zafar/calculator/MainActivity.java <<'EOF'
      package com.zafar.calculator;
      import android.app.Activity;
      import android.os.Bundle;
      import android.webkit.WebView;
      import android.webkit.WebViewClient;
      public class MainActivity extends Activity {
          @Override public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView web = new WebView(this);
              web.getSettings().setJavaScriptEnabled(true);
              web.setWebViewClient(new WebViewClient());
              setContentView(web);
              web.loadUrl("file:///android_asset/index.html");
          }
      }
      EOF

  - name: Build APK
    run: gradle --no-daemon assembleDebug

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: zafar-calculator-apk
      path: app/build/outputs/apk/debug/app-debug.apk
