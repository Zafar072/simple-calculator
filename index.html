<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zafar's Calculator</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#202636">
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #10131c;
  font-family: Arial, sans-serif;
  color: white;
  padding: 15px;
}

.calculator {
  width: min(100%, 360px);
  padding: 22px;
  border-radius: 24px;
  background: #202636;
  box-shadow: 0 12px 35px #0006;
}

h1 {
  font-size: 25px;
  text-align: center;
  margin: 0 0 20px;
}

#expression {
  min-height: 28px;
  overflow-wrap: anywhere;
  text-align: right;
  color: #aab4c8;
  font-size: 17px;
  padding: 5px 3px;
}

#display {
  width: 100%;
  height: 65px;
  margin-bottom: 18px;
  padding: 10px;
  border: none;
  border-radius: 12px;
  background: #111622;
  color: white;
  text-align: right;
  font-size: 32px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

button {
  min-width: 0;
  min-height: 58px;
  border: none;
  border-radius: 12px;
  background: #343e52;
  color: white;
  font-size: 21px;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  opacity: 0.7;
}

.operator {
  background: #176bce;
}

.clear {
  background: #bd414c;
}

.zero {
  grid-column: span 2;
}

footer {
  margin-top: 18px;
  text-align: center;
  font-size: 12px;
  color: #aab4c8;
}
</style></head><body>
<main class="calculator">
  <h1>Zafar's Calculator</h1>  <div id="expression" aria-live="polite"></div>
  <input id="display" value="0" readonly aria-label="Result">  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">AC</button>
    <button onclick="backspace()">DEL</button>
    <button onclick="percent()">%</button>
    <button class="operator" onclick="choose('/')">÷</button><button onclick="digit('7')">7</button>
<button onclick="digit('8')">8</button>
<button onclick="digit('9')">9</button>
<button class="operator" onclick="choose('*')">×</button>

<button onclick="digit('4')">4</button>
<button onclick="digit('5')">5</button>
<button onclick="digit('6')">6</button>
<button class="operator" onclick="choose('-')">−</button>

<button onclick="digit('1')">1</button>
<button onclick="digit('2')">2</button>
<button onclick="digit('3')">3</button>
<button class="operator" onclick="choose('+')">+</button>

<button onclick="sign()">+/−</button>
<button class="zero" onclick="digit('0')">0</button>
<button onclick="digit('.')">.</button>
<button class="operator" onclick="calculate()">=</button>

  </div>  <footer>Built by Zafar | Calculator Web App</footer>
</main><script>
const display = document.getElementById("display");
const expression = document.getElementById("expression");

let first = null;
let operator = null;
let fresh = true;
let finished = false;

const symbols = {
  "+": "+",
  "-": "−",
  "*": "×",
  "/": "÷"
};

function formatNumber(number) {
  if (!Number.isFinite(number)) {
    return String(number);
  }

  return String(Number(number.toPrecision(10)));
}

function digit(value) {
  if (finished) {
    clearDisplay();
  }

  if (fresh) {
    display.value = value === "." ? "0." : value;
    fresh = false;
    return;
  }

  if (value === "." && display.value.includes(".")) {
    return;
  }

  if (display.value.length >= 15) {
    return;
  }

  if (display.value === "0" && value !== ".") {
    display.value = value;
  } else {
    display.value += value;
  }
}

function choose(op) {
  if (display.value === "Cannot divide by zero") {
    clearDisplay();
    return;
  }

  if (operator !== null && !fresh) {
    calculate();
  }

  first = Number(display.value);
  operator = op;
  fresh = true;
  finished = false;

  expression.textContent =
    formatNumber(first) + " " + symbols[operator];
}

function calculate() {
  if (operator === null || first === null || fresh) {
    return;
  }

  const second = Number(display.value);
  const operationText =
    formatNumber(first) + " " +
    symbols[operator] + " " +
    formatNumber(second) + " =";

  let result;

  switch (operator) {
    case "+":
      result = first + second;
      break;
    case "-":
      result = first - second;
      break;
    case "*":
      result = first * second;
      break;
    case "/":
      if (second === 0) {
        expression.textContent = operationText;
        display.value = "Cannot divide by zero";
        first = null;
        operator = null;
        fresh = true;
        finished = true;
        return;
      }
      result = first / second;
      break;
    default:
      return;
  }

  expression.textContent = operationText;
  display.value = formatNumber(result);

  first = null;
  operator = null;
  fresh = true;
  finished = true;
}

function clearDisplay() {
  display.value = "0";
  expression.textContent = "";

  first = null;
  operator = null;
  fresh = true;
  finished = false;
}

function backspace() {
  if (finished || fresh) {
    return;
  }

  display.value =
    display.value.length > 1
      ? display.value.slice(0, -1)
      : "0";

  if (display.value === "-") {
    display.value = "0";
  }
}

function percent() {
  if (display.value === "Cannot divide by zero") {
    clearDisplay();
    return;
  }

  display.value = formatNumber(Number(display.value) / 100);
  fresh = true;
  finished = false;
}

function sign() {
  if (display.value === "Cannot divide by zero") {
    clearDisplay();
    return;
  }

  const number = Number(display.value);

  if (number !== 0) {
    display.value = formatNumber(-number);
  }
}
</script>
</body>
</html>
